<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyGate — Your society, in hand</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="stage">
    <div class="device">
      <div class="device-notch"></div>
      <div class="app" id="app">
        <!-- Screens get rendered by app.js -->

        <!-- Overlays live INSIDE .app so the rounded screen clips them -->
        <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
        <div class="sheet" id="sheet" hidden>
          <div class="sheet-handle"></div>
          <div class="sheet-body" id="sheetBody"></div>
        </div>
        <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
        <aside class="drawer" id="drawer" hidden aria-label="Menu"></aside>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
    <p class="stage-note">MyGate · frontend-only concept · tap the tabs · dummy data</p>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
